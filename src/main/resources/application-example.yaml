server:
  port: 8080
  tomcat:
    keep-alive-timeout: 30000
    max-keep-alive-requests: 100

spring:
  application:
    name: PMS
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://YOUR_SERVER_IP:3306/pet_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true
    username: root
    password: CHANGE_DB_PASSWORD
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: YOUR_SERVER_IP
      port: 6379
      password: CHANGE_REDIS_PASSWORD
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  elasticsearch:
    uris: http://YOUR_SERVER_IP:9200

rocketmq:
  name-server: YOUR_SERVER_IP:9876
  producer:
    group: message-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    consumer:
      group: message-consumer-group
      consume-thread-max: 20
      max-reconsume-times: 3

jwt:
  secret: CHANGE_JWT_SECRET
  expire: 86400
  header: Authorization
  token-prefix: Bearer

framework:
  cache:
    redis:
      prefix: ""
      value-timeout: 30000
      value-time-unit: MILLISECONDS

aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: CHANGE_ACCESS_KEY_ID
    access-key-secret: CHANGE_ACCESS_KEY_SECRET
    bucket-name: YOUR_BUCKET_NAME
    domain: https://YOUR_BUCKET_NAME.oss-cn-hangzhou.aliyuncs.com
    base-path: user/avatar/

elasticsearch:
  host: YOUR_SERVER_IP
  port: 9200

ai:
  agent:
    api-key: CHANGE_API_KEY
    model-name: qwen-turbo
    temperature: 0.7
    max-tokens: 2048
    timeout: 30
    enable-memory: true
    max-memory-rounds: 10
    enable-rag: true
    rag-recall-count: 3