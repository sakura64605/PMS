spring:
  config:
    import:
      - "nacos:application-cloud.yaml?group=${PMS_NACOS_GROUP:PMS}&refreshEnabled=true"
      - "nacos:${spring.application.name}-cloud.yaml?group=${PMS_NACOS_GROUP:PMS}&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${PMS_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${PMS_NACOS_NAMESPACE:}
        group: ${PMS_NACOS_GROUP:PMS}
        username: ${PMS_NACOS_USERNAME:}
        password: ${PMS_NACOS_PASSWORD:}
        ip: ${PMS_SERVICE_IP:127.0.0.1}
      config:
        enabled: true
        server-addr: ${PMS_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${PMS_NACOS_NAMESPACE:}
        username: ${PMS_NACOS_USERNAME:}
        password: ${PMS_NACOS_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
