spring:
  config:
    import: configserver:${PMS_CONFIG_URL:http://127.0.0.1:8888}
  cloud:
    config:
      enabled: true
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 2
    lease-expiration-duration-in-seconds: 6
  client:
    enabled: true
    registry-fetch-interval-seconds: 2
    service-url:
      defaultZone: ${PMS_EUREKA_URL:http://127.0.0.1:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
