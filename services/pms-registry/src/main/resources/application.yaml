server:
  address: 127.0.0.1
  port: 8761
spring:
  application:
    name: pms-registry
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka/
  server:
    response-cache-update-interval-ms: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,info
