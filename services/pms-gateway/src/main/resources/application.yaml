server:
  address: 127.0.0.1
  port: 8088
spring:
  application:
    name: pms-gateway
  main:
    web-application-type: reactive
  cloud:
    config:
      enabled: false
eureka:
  client:
    enabled: false
pms:
  gateway:
    jwt-secret: ${PMS_GATEWAY_JWT_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
