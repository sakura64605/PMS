server {
    listen 80;
    server_name 111.229.254.252;
    root /var/www/html/pms;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite filenames include content hashes; missing assets must return 404.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /xxl-job-admin { return 302 /xxl-job-admin/; }
    location ^~ /xxl-job-admin/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
    # Preserve the existing SockJS upgrade and backend routes.
    location /pet-system/ws/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location = /pet-system/ai/ws {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /pet-system/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name www.petcircle.tech petcircle.tech;
    return 301 https://www.petcircle.tech$request_uri;
}

server {
    listen 443 ssl;
    server_name www.petcircle.tech petcircle.tech;
    ssl_certificate /etc/nginx/ssl/pms/20261027-083949/www.petcircle.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/pms/20261027-083949/www.petcircle.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
